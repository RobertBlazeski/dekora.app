@if (products.length > 0) {
  <section class="carousel">
    @if (heading) {
      <div class="carousel-header">
        <h2>{{ heading }}</h2>
        @if (seeAllLink) {
          <a [routerLink]="['/', translation.currentLocale(), seeAllLink]">{{ 'shopFilters.seeAll' | translate }}</a>
        }
      </div>
    }

    <div class="track-wrap">
      @if (canScrollLeft()) {
        <button type="button" class="scroll-arrow left" [attr.aria-label]="'shopFilters.scrollLeft' | translate" (click)="scrollByPage(-1)">‹</button>
      }
      <div #viewport class="track-viewport" (scroll)="onScroll()">
        <div class="track">
          @for (product of products; track product.id) {
            <div class="card-slot">
              <app-product-card [product]="product" />
            </div>
          }
        </div>
      </div>
      @if (canScrollRight()) {
        <button type="button" class="scroll-arrow right" [attr.aria-label]="'shopFilters.scrollRight' | translate" (click)="scrollByPage(1)">›</button>
      }
    </div>
  </section>
}
