@if (products.length > 0) {
  <section class="carousel">
    @if (heading) {
      <div class="carousel-header">
        <h2>{{ heading }}</h2>
        @if (seeAllLink) {
          <a [routerLink]="['/', translation.currentLocale(), seeAllLink]">{{ 'shopFilters.seeAll' | translate }}</a>
        }
      </div>
    }

    <div class="track-viewport">
      <div class="track" [style.animation-duration.s]="loopDurationSeconds">
        @for (product of products; track product.id + '-a') {
          <div class="card-slot">
            <app-product-card [product]="product" />
          </div>
        }
        <!-- A second, identical copy is what makes the loop invisible: the animation only ever
             translates by exactly -50% (this doubled track's halfway point), which lines up
             pixel-for-pixel with where it started. Hidden from assistive tech and keyboard focus
             since it's a visual duplicate, not distinct content. -->
        @for (product of products; track product.id + '-b') {
          <div class="card-slot">
            <app-product-card [product]="product" [hidden]="true" />
          </div>
        }
      </div>
    </div>
  </section>
}
