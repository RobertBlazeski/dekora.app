<header class="topbar">
  <span class="section-name">{{ currentSectionLabel() }}</span>
  <button type="button" class="menu-btn" (click)="toggleMenu()" aria-label="Menu">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
</header>

@if (menuOpen()) {
  <nav class="mobile-menu">
    @for (link of navLinks; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active" (click)="closeMenu()">{{ link.label }}</a>
    }
    <button type="button" class="sign-out" (click)="signOut()">Sign out</button>
  </nav>
}
