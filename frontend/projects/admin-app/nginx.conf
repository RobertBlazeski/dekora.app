server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Client-side routed SPA — unknown paths fall back to index.html so Angular's
        # router handles them, instead of nginx 404ing on a deep link.
        try_files $uri $uri/ /index.html;
    }
}
